<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>게시글 작성</title>
  <link rel="stylesheet" href="../css/post-write.css" />
</head>
<body>

  <header class="header">
    <button class="btn-back" id="backBtn">&#8249;</button>
    <span class="header-title">아무 말 대잔치</span>
    <div class="header-profile">
      <img class="profile-icon" id="profileIcon" src="../images/default-profile.png" alt="프로필" />
      <div class="dropdown" id="dropdown">
        <button class="dropdown-item" id="editProfileBtn">회원정보수정</button>
        <button class="dropdown-item" id="editPasswordBtn">비밀번호수정</button>
        <button class="dropdown-item" id="logoutBtn">로그아웃</button>
      </div>
    </div>
  </header>

  <main>
    <h2>게시글 작성</h2>

    <div class="form-section">

      <!-- 제목 -->
      <div class="form-group">
        <label for="title">제목*</label>
        <input
          type="text"
          id="title"
          placeholder="제목을 입력해주세요. (최대 26글자)"
          maxlength="26"
        />
        <p class="helper-text" id="titleHelper"></p>
      </div>

      <!-- 내용 -->
      <div class="form-group">
        <label for="content">내용*</label>
        <textarea
          id="content"
          placeholder="내용을 입력해주세요."
        ></textarea>
        <p class="helper-text" id="contentHelper"></p>
      </div>

      <!-- 이미지 -->
      <div class="image-group">
        <label>이미지</label>
        <div class="image-input-wrapper">
          <input type="file" id="fileInput" accept="image/*" />
          <button class="btn-file" id="fileBtn">파일 선택</button>
          <span class="file-name" id="fileName">파일을 선택해주세요.</span>
        </div>
      </div>

      <!-- 완료 버튼 -->
      <button class="btn-submit" id="submitBtn">완료</button>

    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/post-write.js"></script>
</body>
</html>
