<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="../css/signup.css" />
</head>
<body>

  <div class="title-bar">
    <button class="btn-back" id="backBtn">&#8249;</button>
    <span>아무 말 대잔치</span>
  </div>

  <main>
    <div class="register-container">
      <h2>회원가입</h2>

      <!-- 프로필 사진 -->
      <div class="profile-section">
        <label>프로필 사진</label>
        <p class="helper-text" id="profileHelper"></p>
        <div class="profile-img-wrapper">
          <!-- 숨겨진 파일 입력 -->
          <input type="file" id="fileInput" accept="image/*" style="display: none;" />
          <!-- 클릭 시 파일창 열림 -->
          <button class="profile-img-btn" id="profileBtn">
            <span>+</span>
            <img id="profileImg" alt="프로필 미리보기" />
          </button>
        </div>
      </div>

      <!-- 입력 폼 -->
      <div class="form-section">
        <div class="form-group">
          <label for="email">이메일*</label>
          <input type="email" id="email" placeholder="이메일을 입력하세요" />
          <p class="helper-text" id="emailHelper"></p>
        </div>

        <div class="form-group">
          <label for="password">비밀번호*</label>
          <input type="password" id="password" placeholder="비밀번호를 입력하세요" />
          <p class="helper-text" id="passwordHelper"></p>
        </div>

        <div class="form-group">
          <label for="passwordConfirm">비밀번호 확인*</label>
          <input type="password" id="passwordConfirm" placeholder="비밀번호 한번 더 입력하세요" />
          <p class="helper-text" id="passwordConfirmHelper"></p>
        </div>

        <div class="form-group">
          <label for="nickname">닉네임*</label>
          <input type="text" id="nickname" placeholder="닉네임을 입력하세요" />
          <p class="helper-text" id="nicknameHelper"></p>
        </div>

        <button class="btn-register" id="registerBtn">회원가입</button>
      </div>

      <!-- 로그인하러 가기 -->
      <div class="login-section">
        <button class="btn-to-login" id="toLoginBtn">로그인하러 가기</button>
      </div>

    </div>
  </main>

  <script src="../js/signup.js"></script>
</body>
</html>
