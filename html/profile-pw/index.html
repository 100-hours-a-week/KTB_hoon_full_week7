<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>비밀번호 수정</title>
  <link rel="stylesheet" href="../css/profile-pw.css" />
</head>
<body>

  <header class="header">
    <span class="header-title">아무 말 대잔치</span>
    <div class="header-profile">
      <img class="profile-icon" id="profileIcon" src="../images/default-profile.png" alt="프로필" />
      <div class="dropdown" id="dropdown">
        <button class="dropdown-item" id="editProfileBtn">회원정보수정</button>
        <button class="dropdown-item" id="editPasswordBtn">비밀번호수정</button>
        <button class="dropdown-item" id="logoutBtn">로그아웃</button>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <h2>비밀번호 수정</h2>

      <div class="form-section">
        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호를 입력하세요" />
          <p class="helper-text" id="passwordHelper">비밀번호는 8자 이상, 20자 이하이며, 대문자, 소문자, 숫자, 특수문자를 각각 최소 1개씩 포함해야 합니다.</p>
        </div>

        <div class="form-group">
          <label for="passwordConfirm">비밀번호 확인</label>
          <input type="password" id="passwordConfirm" placeholder="비밀번호를 한번 더 입력하세요" />
          <p class="helper-text" id="passwordConfirmHelper"></p>
        </div>

        <button class="btn-submit" id="submitBtn">수정하기</button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">수정완료</div>

  <script src="../js/profile-pw.js"></script>
</body>
</html>
