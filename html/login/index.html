<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>아무 말 대잔치</title>
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <div class="title-bar">아무 말 대잔치</div>

  <main>
    <div class="login-container">
      <h2>로그인</h2>

      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="이메일을 입력하세요" />
        <p class="helper-text" id="emailHelper"></p>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요" />
        <p class="helper-text" id="passwordHelper"></p>
      </div>

      <button class="btn-login" id="loginBtn">로그인</button>
      <button class="btn-register" id="signupBtn">회원가입</button>
    </div>
  </main>

  <script src="../js/login.js"></script>
</body>
</html>
